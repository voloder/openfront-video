# openfront.video on one server: the app, and Caddy in front for HTTPS with
# Let's Encrypt certificates (issued and renewed automatically).
#
#   cp .env.example .env    # set DOMAIN and ACME_EMAIL
#   docker compose up -d --build
#
# Needs DNS A/AAAA records for the domain (and www.) pointing at this server,
# and ports 80 and 443 open.

services:
  app:
    build: .
    image: openfront-video
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      MAX_RENDERS: ${MAX_RENDERS:-2}
      EMBED_WAIT_SECS: ${EMBED_WAIT_SECS:-25}
      VIDEO_WAIT_SECS: ${VIDEO_WAIT_SECS:-120}
      MAX_STORAGE_GB: ${MAX_STORAGE_GB:-35}
      ENGINES_KEEP: ${ENGINES_KEEP:-3}
      AUTO_RENDER: ${AUTO_RENDER:-1}
      AUTO_POLL_SECS: ${AUTO_POLL_SECS:-60}
      AUTO_LOOKBACK_MINS: ${AUTO_LOOKBACK_MINS:-180}
      AUTO_MAX_AGE_MINS: ${AUTO_MAX_AGE_MINS:-30}
      AUTO_MIN_PLAYERS: ${AUTO_MIN_PLAYERS:-10}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RENDER_API_TOKEN: ${RENDER_API_TOKEN:-}
      ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
      ADSENSE_SLOT: ${ADSENSE_SLOT:-}
    volumes:
      - videos:/data
    # Only Caddy talks to it.
    expose:
      - "8080"

  # Discord embed timing test (embedtest/server.mjs) on test.<DOMAIN>. Off unless
  # started with: docker compose --profile test up -d
  embedtest:
    image: node:24-alpine
    profiles: [test]
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      PUBLIC_URL: https://test.${DOMAIN}
      VIDEO: /app/test.webm
      LOG: /app/embedtest.log
    volumes:
      - ./embedtest:/app
    expose:
      - "8090"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account; keep them so restarts don't hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  videos:
  caddy_data:
  caddy_config:
